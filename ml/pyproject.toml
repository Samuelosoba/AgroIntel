[project]
name = "agroml"
version = "0.1.0"
description = "AgroIntel training pipeline: dataset prep, training, evaluation and export"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "timm>=1.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.4",
  "imagehash>=4.3",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "requests>=2.32",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
